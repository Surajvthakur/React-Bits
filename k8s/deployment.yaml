apiVersion: apps/v1
kind: Deployment
metadata: 
  name: react-bits-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-bits
  template:
    metadata:
      labels:
        app: react-bits
    spec:
      containers:
        - name: react-bits
          # local configurations
          # image: react-bits:latest
          # imagePullPolicy: Never

          # Production configurations
          image: suraj2104/react-bits:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
        